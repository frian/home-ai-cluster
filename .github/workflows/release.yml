name: Publish stable release to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated stable release tag in the form vX.Y.Z
        required: true
        type: string

jobs:
  build:
    name: Build and validate stable distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify main dispatch ref
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Validate stable tag input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated stable tag and source identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(git cat-file -t "$tag_object")" = tag
          tagged_commit="$(git rev-parse "$RELEASE_TAG^{}")"
          test "$(git rev-parse HEAD)" = "$tagged_commit"
          git cat-file -e "$GITHUB_SHA^{commit}"
          git merge-base --is-ancestor "$tagged_commit" "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Validate locked source
        run: |
          uv lock --check
          uv sync --locked
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pytest

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          python - "$expected_version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected_version = sys.argv[1]
          project = tomllib.loads(Path("pyproject.toml").read_text())
          actual_version = project["project"]["version"]
          if actual_version != expected_version:
              raise SystemExit(
                  f"pyproject.toml version {actual_version!r} does not match "
                  f"{expected_version!r}"
              )
          PY

      - name: Install release build tools
        run: python -m pip install "build==1.5.0" "twine==7.0.0"

      - name: Build distributions
        run: python -m build

      - name: Verify expected distributions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          expected_files="$(printf '%s\n' \
            "home_ai_cluster-${expected_version}-py3-none-any.whl" \
            "home_ai_cluster-${expected_version}.tar.gz" | LC_ALL=C sort)"
          actual_files="$(find dist -type f -printf '%P\n' | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify distribution contents and metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          python - "$expected_version" <<'PY'
          import sys
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          expected_version = sys.argv[1]
          repository_files = {
              "LICENSE": Path("LICENSE").read_bytes(),
              "NOTICE": Path("NOTICE").read_bytes(),
              "LICENSES/pdfjs-6.2.108-APACHE-2.0.txt": Path(
                  "LICENSES/pdfjs-6.2.108-APACHE-2.0.txt"
              ).read_bytes(),
          }
          pdfjs_assets = (
              "pdf.min.mjs",
              "pdf.worker.min.mjs",
          )
          wheel_path = Path(
              f"dist/home_ai_cluster-{expected_version}-py3-none-any.whl"
          )
          sdist_path = Path(f"dist/home_ai_cluster-{expected_version}.tar.gz")

          with zipfile.ZipFile(wheel_path) as wheel:
              metadata_names = [
                  name
                  for name in wheel.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_names) != 1:
                  raise SystemExit("wheel must contain exactly one METADATA file")
              dist_info = metadata_names[0].removesuffix("METADATA")
              wheel_metadata = BytesParser().parsebytes(
                  wheel.read(metadata_names[0])
              )
              for path, expected_content in repository_files.items():
                  archive_path = f"{dist_info}licenses/{path}"
                  if wheel.read(archive_path) != expected_content:
                      raise SystemExit(f"wheel {archive_path} content differs")
              for asset in pdfjs_assets:
                  archive_path = (
                      "home_ai_cluster/web/assets/pdfjs-6.2.108/" + asset
                  )
                  if archive_path not in wheel.namelist():
                      raise SystemExit(f"wheel is missing {archive_path}")

          with tarfile.open(sdist_path) as sdist:
              metadata_members = [
                  member
                  for member in sdist.getmembers()
                  if member.name.endswith("/PKG-INFO")
              ]
              if len(metadata_members) != 1:
                  raise SystemExit("sdist must contain exactly one PKG-INFO file")
              sdist_metadata = BytesParser().parsebytes(
                  sdist.extractfile(metadata_members[0]).read()
              )
              root = metadata_members[0].name.removesuffix("/PKG-INFO")
              for path, expected_content in repository_files.items():
                  archive_path = f"{root}/{path}"
                  member = sdist.getmember(archive_path)
                  if sdist.extractfile(member).read() != expected_content:
                      raise SystemExit(f"sdist {archive_path} content differs")
              for asset in pdfjs_assets:
                  archive_path = (
                      f"{root}/src/home_ai_cluster/web/assets/"
                      f"pdfjs-6.2.108/{asset}"
                  )
                  sdist.getmember(archive_path)

          for name, metadata in (
              ("wheel", wheel_metadata),
              ("sdist", sdist_metadata),
          ):
              if metadata["Version"] != expected_version:
                  raise SystemExit(
                      f"{name} metadata version {metadata['Version']!r} does not "
                      f"match {expected_version!r}"
                  )
          PY

      - name: Smoke test installed wheel
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          venv_dir="$(mktemp -d)"
          trap 'rm -rf "$venv_dir"' EXIT
          python -m venv "$venv_dir"
          cd "$venv_dir"
          "$venv_dir/bin/python" -m pip install \
            "$GITHUB_WORKSPACE/dist/home_ai_cluster-${expected_version}-py3-none-any.whl"
          "$venv_dir/bin/hac" --help

      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
