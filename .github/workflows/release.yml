name: Publish historical v0.2.0 to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build historical v0.2.0 distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out historical release source
        uses: actions/checkout@v6
        with:
          ref: v0.2.0
          persist-credentials: false

      - name: Verify historical release commit
        run: |
          expected_sha=1c3b9c188b5f512e607c480a5a0f4e0e2f52a5e1
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify expected distributions
        run: |
          test -f dist/home_ai_cluster-0.2.0-py3-none-any.whl
          test -f dist/home_ai_cluster-0.2.0.tar.gz

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
