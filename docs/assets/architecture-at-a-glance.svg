<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1120" role="img" aria-labelledby="title desc">
  <title id="title">Home AI Cluster architecture at a glance</title>
  <desc id="desc">CLI and Web UI clients send native capability requests to a HAC endpoint. The orchestrator performs local-first capability-based routing across one local node and two explicitly eligible remote nodes. Example capabilities are distributed across the three nodes, and each node connects through a runtime adapter to an AI runtime.</desc>
  <defs>
    <linearGradient id="clientsFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <linearGradient id="endpointFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8ff"/>
      <stop offset="1" stop-color="#eee6ff"/>
    </linearGradient>
    <linearGradient id="orchestratorFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ffedc7"/>
    </linearGradient>
    <linearGradient id="localFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fcf8"/>
      <stop offset="1" stop-color="#e5f5ec"/>
    </linearGradient>
    <linearGradient id="remoteAFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6faff"/>
      <stop offset="1" stop-color="#e6f1ff"/>
    </linearGradient>
    <linearGradient id="remoteBFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f8"/>
      <stop offset="1" stop-color="#ffe9e9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 z" fill="#2f77d0"/>
    </marker>
    <marker id="arrowPurple" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 z" fill="#7b4ee8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 z" fill="#f59e0b"/>
    </marker>
    <style>
      .title { fill:#0f1f36; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight:700; }
      .text { fill:#0f1f36; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    </style>
  </defs>

  <rect width="1536" height="1120" fill="#ffffff"/>

  <!-- Clients -->
  <g filter="url(#softShadow)">
    <rect x="438" y="30" width="660" height="178" rx="20" fill="url(#clientsFill)" stroke="#5a94df" stroke-width="4"/>
  </g>
  <text x="768" y="80" text-anchor="middle" class="title" font-size="38">Clients</text>

  <rect x="468" y="97" width="292" height="83" rx="14" fill="#ffffff" fill-opacity=".42" stroke="#9dbce8" stroke-width="2"/>
  <text x="614" y="133" text-anchor="middle" class="title" font-size="28">CLI</text>
  <text x="614" y="163" text-anchor="middle" class="text" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">hac &lt;command&gt;</text>

  <rect x="780" y="97" width="288" height="83" rx="14" fill="#ffffff" fill-opacity=".42" stroke="#9dbce8" stroke-width="2"/>
  <text x="924" y="133" text-anchor="middle" class="title" font-size="28">Web UI</text>
  <text x="924" y="163" text-anchor="middle" class="text" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">http://127.0.0.1:25042/</text>

  <path d="M768 208 V262" stroke="#2f77d0" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- HAC endpoint -->
  <g filter="url(#softShadow)">
    <rect x="363" y="278" width="810" height="171" rx="18" fill="url(#endpointFill)" stroke="#7b4ee8" stroke-width="4"/>
  </g>
  <text x="768" y="328" text-anchor="middle" class="title" font-size="38">HAC endpoint</text>
  <text x="768" y="366" text-anchor="middle" class="text" font-size="25">Capability request (native API)</text>
  <rect x="386" y="383" width="764" height="50" rx="12" fill="#ffffff" fill-opacity=".5" stroke="#b7a6eb" stroke-width="2"/>
  <text x="768" y="415" text-anchor="middle" class="text" font-size="19.5">POST /v1/chat  ·  /v1/summarize  ·  /v1/classify  ·  /v1/image-generation</text>

  <path d="M768 449 V509" stroke="#7b4ee8" stroke-width="5" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- Orchestrator -->
  <g filter="url(#softShadow)">
    <rect x="525" y="525" width="486" height="128" rx="18" fill="url(#orchestratorFill)" stroke="#f59e0b" stroke-width="4"/>
  </g>
  <text x="768" y="573" text-anchor="middle" class="title" font-size="37">Orchestrator</text>
  <text x="768" y="610" text-anchor="middle" class="text" font-size="24">Capability-based routing</text>
  <text x="768" y="638" text-anchor="middle" class="text" font-size="20">Local-first with explicit eligible nodes</text>

  <!-- Routing fan-out -->
  <path d="M525 589 H282 V719" stroke="#f59e0b" stroke-width="4.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M768 653 V719" stroke="#f59e0b" stroke-width="4.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M1011 589 H1254 V719" stroke="#f59e0b" stroke-width="4.5" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- Local node -->
  <g filter="url(#softShadow)">
    <rect x="49" y="735" width="454" height="355" rx="18" fill="url(#localFill)" stroke="#4f9a74" stroke-width="4"/>
  </g>
  <text x="276" y="784" text-anchor="middle" class="title" font-size="34">Local node</text>
  <text x="276" y="814" text-anchor="middle" class="text" font-size="20">This machine (local-first)</text>

  <rect x="69" y="829" width="414" height="106" rx="13" fill="#ffffff" fill-opacity=".35" stroke="#8bc4a7" stroke-width="2"/>
  <text x="276" y="864" text-anchor="middle" class="title" font-size="21">Capabilities (example)</text>
  <rect x="87" y="880" width="87" height="42" rx="10" fill="#eaf8ef" stroke="#55a87a" stroke-width="2"/>
  <text x="130.5" y="907" text-anchor="middle" class="text" font-size="19">chat</text>
  <rect x="189" y="880" width="91" height="42" rx="10" fill="#eef6ff" stroke="#6ba5e7" stroke-width="2"/>
  <text x="234.5" y="907" text-anchor="middle" class="text" font-size="19">code</text>
  <rect x="296" y="880" width="169" height="42" rx="10" fill="#fff0f0" stroke="#ef6c6c" stroke-width="2"/>
  <text x="380.5" y="907" text-anchor="middle" class="text" font-size="18">image-generation</text>

  <rect x="69" y="950" width="414" height="56" rx="12" fill="#ffffff" fill-opacity=".45" stroke="#8bc4a7" stroke-width="2"/>
  <text x="276" y="985" text-anchor="middle" class="text" font-size="24">Runtime adapter</text>
  <rect x="69" y="1021" width="414" height="50" rx="12" fill="#ffffff" fill-opacity=".45" stroke="#8bc4a7" stroke-width="2"/>
  <text x="276" y="1053" text-anchor="middle" class="text" font-size="24">AI runtime</text>

  <!-- Remote node A -->
  <g filter="url(#softShadow)">
    <rect x="545" y="735" width="446" height="355" rx="18" fill="url(#remoteAFill)" stroke="#5a94df" stroke-width="4"/>
  </g>
  <text x="768" y="784" text-anchor="middle" class="title" font-size="34">Remote node A</text>
  <text x="768" y="814" text-anchor="middle" class="text" font-size="20">Explicitly eligible (e.g. rasp)</text>

  <rect x="566" y="829" width="404" height="106" rx="13" fill="#ffffff" fill-opacity=".35" stroke="#9dbce8" stroke-width="2"/>
  <text x="768" y="864" text-anchor="middle" class="title" font-size="21">Capabilities (example)</text>
  <rect x="622" y="880" width="143" height="42" rx="10" fill="#f4efff" stroke="#9a6de7" stroke-width="2"/>
  <text x="693.5" y="907" text-anchor="middle" class="text" font-size="19">summarize</text>
  <rect x="785" y="880" width="130" height="42" rx="10" fill="#fff7dd" stroke="#e9ad2b" stroke-width="2"/>
  <text x="850" y="907" text-anchor="middle" class="text" font-size="19">classify</text>

  <rect x="566" y="950" width="404" height="56" rx="12" fill="#ffffff" fill-opacity=".45" stroke="#9dbce8" stroke-width="2"/>
  <text x="768" y="985" text-anchor="middle" class="text" font-size="24">Runtime adapter</text>
  <rect x="566" y="1021" width="404" height="50" rx="12" fill="#ffffff" fill-opacity=".45" stroke="#9dbce8" stroke-width="2"/>
  <text x="768" y="1053" text-anchor="middle" class="text" font-size="24">AI runtime</text>

  <!-- Remote node B -->
  <g filter="url(#softShadow)">
    <rect x="1033" y="735" width="454" height="355" rx="18" fill="url(#remoteBFill)" stroke="#e75b55" stroke-width="4"/>
  </g>
  <text x="1260" y="784" text-anchor="middle" class="title" font-size="34">Remote node B</text>
  <text x="1260" y="814" text-anchor="middle" class="text" font-size="20">Explicitly eligible (e.g. sat)</text>

  <rect x="1053" y="829" width="414" height="106" rx="13" fill="#ffffff" fill-opacity=".35" stroke="#efa3a0" stroke-width="2"/>
  <text x="1260" y="864" text-anchor="middle" class="title" font-size="21">Capabilities (example)</text>
  <rect x="1085" y="880" width="90" height="42" rx="10" fill="#eaf8ef" stroke="#55a87a" stroke-width="2"/>
  <text x="1130" y="907" text-anchor="middle" class="text" font-size="19">chat</text>
  <rect x="1192" y="880" width="94" height="42" rx="10" fill="#eef6ff" stroke="#6ba5e7" stroke-width="2"/>
  <text x="1239" y="907" text-anchor="middle" class="text" font-size="19">code</text>
  <rect x="1303" y="880" width="128" height="42" rx="10" fill="#fff7dd" stroke="#e9ad2b" stroke-width="2"/>
  <text x="1367" y="907" text-anchor="middle" class="text" font-size="19">classify</text>

  <rect x="1053" y="950" width="414" height="56" rx="12" fill="#ffffff" fill-opacity=".45" stroke="#efa3a0" stroke-width="2"/>
  <text x="1260" y="985" text-anchor="middle" class="text" font-size="24">Runtime adapter</text>
  <rect x="1053" y="1021" width="414" height="50" rx="12" fill="#ffffff" fill-opacity=".45" stroke="#efa3a0" stroke-width="2"/>
  <text x="1260" y="1053" text-anchor="middle" class="text" font-size="24">AI runtime</text>
</svg>
