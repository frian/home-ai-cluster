[project]
name = "home-ai-cluster"
version = "0.1.0"
description = "Local-first orchestration for personal AI runtimes."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
home-ai-cluster-static-proof = "home_ai_cluster.static_proof:main"
home-ai-cluster-static-cluster = "home_ai_cluster.static_cluster:main"
home-ai-cluster-automatic-proof = "home_ai_cluster.automatic_proof:main"
home-ai-cluster-fallback-proof = "home_ai_cluster.fallback_proof:main"
home-ai-cluster-explain-routing = "home_ai_cluster.routing_explanation:main"
home-ai-cluster-explain-request = "home_ai_cluster.actual_request_explanation:main"
home-ai-cluster-openai-compatibility = "home_ai_cluster.openai_compatibility:main"
home-ai-cluster-health = "home_ai_cluster.local_health_snapshot:main"
home-ai-cluster-preflight = "home_ai_cluster.static_preflight:main"
home-ai-cluster-status = "home_ai_cluster.status_command:main"
home-ai-cluster-history = "home_ai_cluster.request_history:history_main"
home-ai-cluster-clear-history = "home_ai_cluster.request_history:clear_history_main"
home-ai-cluster-phase-12-heterogeneous-receiver = "home_ai_cluster.phase_12_heterogeneous_runtime_cluster_proof:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_ai_cluster"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
