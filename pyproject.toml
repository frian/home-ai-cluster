[project]
name = "home-ai-cluster"
version = "1.0.0b2"
description = "Local-first orchestration for personal AI runtimes."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "LICENSES/pdfjs-6.2.108-APACHE-2.0.txt"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "uvicorn[standard]>=0.35.0",
]

[project.urls]
Repository = "https://github.com/frian/home-ai-cluster"
Issues = "https://github.com/frian/home-ai-cluster/issues"
Documentation = "https://github.com/frian/home-ai-cluster/blob/main/docs/README.md"

[project.scripts]
home-ai-cluster = "home_ai_cluster.command:main"
hac = "home_ai_cluster.command:main"
home-ai-cluster-static-cluster = "home_ai_cluster.static_cluster:main"
home-ai-cluster-explain-routing = "home_ai_cluster.routing_explanation:main"
home-ai-cluster-explain-request = "home_ai_cluster.actual_request_explanation:main"
home-ai-cluster-openai-compatibility = "home_ai_cluster.openai_compatibility:main"
home-ai-cluster-health = "home_ai_cluster.local_health_snapshot:main"
home-ai-cluster-preflight = "home_ai_cluster.static_preflight:main"
home-ai-cluster-status = "home_ai_cluster.status_command:main"
home-ai-cluster-history = "home_ai_cluster.request_history:history_main"
home-ai-cluster-clear-history = "home_ai_cluster.request_history:clear_history_main"
home-ai-cluster-local = "home_ai_cluster.local_runtime:main"
home-ai-cluster-chat = "home_ai_cluster.chat_command:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_ai_cluster"]
include = ["src/home_ai_cluster/web/**"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
