<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Home AI Cluster</title><link rel="stylesheet" href="/assets/lan.css"></head>
<body><main><h1>Home AI Cluster</h1><p>Trusted-LAN capability access</p>
<section><h2>Chat</h2><form data-capability="chat"><textarea required></textarea><button>Send</button></form></section>
<section><h2>Code</h2><form data-capability="code"><textarea required></textarea><button>Request code</button></form></section>
<section><h2>Summarize</h2><form data-path="/v1/summarize"><textarea required></textarea><button>Summarize</button></form></section>
<section><h2>Classify</h2><form data-path="/v1/classify"><textarea required></textarea><div id="label-inputs"><input class="classify-label" required><input class="classify-label" required></div><button id="add-label" type="button">Add label</button><button>Classify</button></form></section>
<section><h2>Image Generation</h2><form data-path="/v1/image-generation"><textarea required></textarea><label>Width (optional, 64–2048 px)<input id="image-generation-width" min="64" max="2048" step="1" type="number"></label><label>Height (optional, 64–2048 px)<input id="image-generation-height" min="64" max="2048" step="1" type="number"></label><button>Generate</button></form><img hidden id="generated-image" alt="Generated image"></section>
<output aria-live="polite" id="result"></output></main><script src="/assets/lan.js"></script></body></html>
